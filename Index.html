<body>
  <div class="app-container">
    <!-- Sidebar -->
    <?!= include('Sidebar'); ?>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Header -->
      <header class="app-header">
        <div class="header-left">
          <button class="menu-toggle" onclick="toggleSidebar()">
            <i class="fas fa-bars"></i>
          </button>
          <div class="header-title">
            <h2>Trang chủ</h2>
          </div>
        </div>

        <div class="header-right">
          <!-- User Dropdown -->
          <div class="user-dropdown" id="userDropdown">
            <button class="user-dropdown-toggle" onclick="toggleUserDropdown()">
              <div class="user-avatar">
                <?= session.fullName ? session.fullName.charAt(0).toUpperCase() : 'U' ?>
              </div>
              <div class="user-details">
                <div class="user-name"><?= session.fullName || 'User' ?></div>
                <div class="user-role"><?= session.role || 'User' ?></div>
              </div>
              <i class="fas fa-chevron-down" style="font-size: 12px; color: var(--gray-color);"></i>
            </button>

            <!-- Dropdown Menu -->
            <div class="user-dropdown-menu">
              <button onclick="showChangePasswordModal()">
                <i class="fas fa-key"></i>
                <span>Đổi mật khẩu</span>
              </button>
              <div class="user-dropdown-divider"></div>
              <button onclick="handleLogout()" style="color: var(--danger-color);">
                <i class="fas fa-sign-out-alt"></i>
                <span>Đăng xuất</span>
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- Content Area -->
      <div class="content-area" id="contentArea">
        <!-- Dynamic Content -->
        <div id="dynamicContent">
          <!-- Trang chủ - Dashboard -->
          <div id="page-home" class="page-content">
            <div class="card">
              <div class="card-header">
                <h3 class="card-title">
                  <i class="fas fa-chart-line"></i>
                  Dashboard - Tổng quan
                </h3>
              </div>
              <div class="card-body">
                <!-- Stats Cards -->
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px;">
                  <!-- Thu nhập -->
                  <div class="card" style="background: linear-gradient(135deg, #24c560, #1ea550); color: white; box-shadow: 0 4px 15px rgba(36, 197, 96, 0.3);">
                    <div style="display: flex; align-items: center; justify-content: space-between;">
                      <div>
                        <p style="font-size: 14px; opacity: 0.9; margin-bottom: 5px;">Thu nhập tháng này</p>
                        <h2 style="font-size: 28px; font-weight: 700; margin: 0;" id="totalIncome">0₫</h2>
                      </div>
                      <div style="font-size: 48px; opacity: 0.3;">
                        <i class="fas fa-money-bill-wave"></i>
                      </div>
                    </div>
                  </div>

                  <!-- Chi tiêu -->
                  <div class="card" style="background: linear-gradient(135deg, #e94849, #d63334); color: white; box-shadow: 0 4px 15px rgba(233, 72, 73, 0.3);">
                    <div style="display: flex; align-items: center; justify-content: space-between;">
                      <div>
                        <p style="font-size: 14px; opacity: 0.9; margin-bottom: 5px;">Chi tiêu tháng này</p>
                        <h2 style="font-size: 28px; font-weight: 700; margin: 0;" id="totalExpense">0₫</h2>
                      </div>
                      <div style="font-size: 48px; opacity: 0.3;">
                        <i class="fas fa-shopping-cart"></i>
                      </div>
                    </div>
                  </div>

                  <!-- Tiết kiệm -->
                  <div class="card" style="background: linear-gradient(135deg, #3782f4, #2563eb); color: white; box-shadow: 0 4px 15px rgba(55, 130, 244, 0.3);">
                    <div style="display: flex; align-items: center; justify-content: space-between;">
                      <div>
                        <p style="font-size: 14px; opacity: 0.9; margin-bottom: 5px;">Tiết kiệm tháng này</p>
                        <h2 style="font-size: 28px; font-weight: 700; margin: 0;" id="totalSaving">0₫</h2>
                      </div>
                      <div style="font-size: 48px; opacity: 0.3;">
                        <i class="fas fa-piggy-bank"></i>
                      </div>
                    </div>
                  </div>

                  <!-- Tổng tài sản -->
                  <div class="card" style="background: linear-gradient(135deg, #f99d07, #e08c06); color: white; box-shadow: 0 4px 15px rgba(249, 157, 7, 0.3);">
                    <div style="display: flex; align-items: center; justify-content: space-between;">
                      <div>
                        <p style="font-size: 14px; opacity: 0.9; margin-bottom: 5px;">Tổng tài sản</p>
                        <h2 style="font-size: 28px; font-weight: 700; margin: 0;" id="totalAssets">0₫</h2>
                      </div>
                      <div style="font-size: 48px; opacity: 0.3;">
                        <i class="fas fa-wallet"></i>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- Loading State -->
                <div id="dashboardLoading" style="text-align: center; padding: 60px 20px;">
                  <div class="loading" style="width: 40px; height: 40px; border-width: 4px; border-color: var(--gray-color); border-top-color: var(--primary-color); margin: 0 auto 20px;"></div>
                  <p style="color: var(--gray-color);">Đang tải dữ liệu...</p>
                </div>

                <!-- Recent Transactions -->
                <div id="recentTransactions" class="hidden">
                  <h4 style="margin-bottom: 15px; color: var(--dark-color);">
                    <i class="fas fa-history"></i>
                    Giao dịch gần đây
                  </h4>
                  <div class="table-container">
                    <table>
                      <thead>
                        <tr>
                          <th class="sticky-col-1">Ngày</th>
                          <th>Loại</th>
                          <th>Danh mục</th>
                          <th>Số tiền</th>
                          <th>Mô tả</th>
                        </tr>
                      </thead>
                      <tbody id="recentTransactionsBody">
                        <!-- Dynamic content -->
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Các page khác sẽ được thêm ở đây -->

          <!-- Trang Quản lý Tài khoản -->
          <?!= include('Accounts'); ?>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Container -->
  <div id="modalContainer"></div>

  <!-- Include App.js -->
  <?!= include('App.js'); ?>

  <script>
    // Session data from server
    const SESSION = {
      userId: '<?= session.userId ?>',
      username: '<?= session.username ?>',
      fullName: '<?= session.fullName ?>',
      email: '<?= session.email ?>',
      role: '<?= session.role ?>',
      loginTime: '<?= session.loginTime ?>'
    };

    // Config data from server
    const CONFIG = <?= JSON.stringify(config) ?>;

    // Toggle User Dropdown
    function toggleUserDropdown() {
      const dropdown = document.getElementById('userDropdown');
      dropdown.classList.toggle('active');
    }

    // Close dropdown when clicking outside
    document.addEventListener('click', function(e) {
      const dropdown = document.getElementById('userDropdown');
      if (dropdown && !dropdown.contains(e.target)) {
        dropdown.classList.remove('active');
      }
    });

    // Show Change Password Modal
    function showChangePasswordModal() {
      // Close user dropdown
      document.getElementById('userDropdown').classList.remove('active');

      const modalContainer = document.getElementById('modalContainer');
      modalContainer.innerHTML = `
        <div class="modal-overlay show" id="changePasswordModal">
          <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
              <h3 class="modal-title">
                <i class="fas fa-key text-primary"></i>
                Đổi mật khẩu
              </h3>
              <button class="modal-close" onclick="closeModal()">
                <i class="fas fa-times"></i>
              </button>
            </div>
            <form id="changePasswordForm" onsubmit="handleChangePassword(event)">
              <div class="modal-body">
                <!-- Old Password -->
                <div class="form-group">
                  <label class="form-label required">Mật khẩu hiện tại</label>
                  <div class="input-group" style="position: relative;">
                    <i class="fas fa-lock input-group-icon"></i>
                    <input
                      type="password"
                      id="oldPassword"
                      class="form-control"
                      placeholder="Nhập mật khẩu hiện tại"
                      required
                      style="padding-left: 45px;"
                    >
                  </div>
                </div>

                <!-- New Password -->
                <div class="form-group">
                  <label class="form-label required">Mật khẩu mới</label>
                  <div class="input-group" style="position: relative;">
                    <i class="fas fa-key input-group-icon"></i>
                    <input
                      type="password"
                      id="newPassword"
                      class="form-control"
                      placeholder="Nhập mật khẩu mới"
                      required
                      minlength="6"
                      style="padding-left: 45px;"
                    >
                  </div>
                  <small style="color: var(--gray-color); font-size: 12px;">Tối thiểu 6 ký tự</small>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                  <label class="form-label required">Xác nhận mật khẩu mới</label>
                  <div class="input-group" style="position: relative;">
                    <i class="fas fa-check-circle input-group-icon"></i>
                    <input
                      type="password"
                      id="confirmPassword"
                      class="form-control"
                      placeholder="Nhập lại mật khẩu mới"
                      required
                      minlength="6"
                      style="padding-left: 45px;"
                    >
                  </div>
                </div>

                <div id="passwordError" class="hidden" style="padding: 10px; background: #f8d7da; color: #721c24; border-radius: 4px; margin-top: 10px; font-size: 13px;">
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">
                  <i class="fas fa-times"></i> Hủy
                </button>
                <button type="submit" class="btn btn-primary" id="changePasswordBtn">
                  <i class="fas fa-check"></i>
                  <span id="changePasswordBtnText">Đổi mật khẩu</span>
                  <span id="changePasswordBtnLoading" class="loading hidden" style="border-top-color: white;"></span>
                </button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    // Handle Change Password
    function handleChangePassword(event) {
      event.preventDefault();

      const oldPassword = document.getElementById('oldPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorDiv = document.getElementById('passwordError');

      // Validate
      if (newPassword !== confirmPassword) {
        errorDiv.textContent = 'Mật khẩu mới và xác nhận mật khẩu không khớp!';
        errorDiv.classList.remove('hidden');
        return;
      }

      if (newPassword === oldPassword) {
        errorDiv.textContent = 'Mật khẩu mới phải khác mật khẩu hiện tại!';
        errorDiv.classList.remove('hidden');
        return;
      }

      // Hide error
      errorDiv.classList.add('hidden');

      // Show loading
      const btn = document.getElementById('changePasswordBtn');
      const btnText = document.getElementById('changePasswordBtnText');
      const btnLoading = document.getElementById('changePasswordBtnLoading');

      btn.disabled = true;
      btnText.classList.add('hidden');
      btnLoading.classList.remove('hidden');

      // Call server
      google.script.run
        .withSuccessHandler(function(response) {
          btn.disabled = false;
          btnText.classList.remove('hidden');
          btnLoading.classList.add('hidden');

          if (response.success) {
            closeModal();
            showModal('Thành công', 'Đổi mật khẩu thành công! Vui lòng đăng nhập lại.', 'success');

            // Redirect to login after 2 seconds
            setTimeout(function() {
              window.location.href = '<?= ScriptApp.getService().getUrl() ?>?page=login';
            }, 2000);
          } else {
            errorDiv.textContent = response.message;
            errorDiv.classList.remove('hidden');
          }
        })
        .withFailureHandler(function(error) {
          btn.disabled = false;
          btnText.classList.remove('hidden');
          btnLoading.classList.add('hidden');

          errorDiv.textContent = 'Lỗi kết nối: ' + error.message;
          errorDiv.classList.remove('hidden');
        })
        .handleChangePassword(oldPassword, newPassword);
    }

    // Handle Logout
    function handleLogout() {
      // Close user dropdown if open
      const dropdown = document.getElementById('userDropdown');
      if (dropdown) {
        dropdown.classList.remove('active');
      }

      showConfirm(
        'Xác nhận đăng xuất',
        'Bạn có chắc chắn muốn đăng xuất khỏi hệ thống?',
        function() {
          // User confirmed - proceed with logout
          showLoading('Đang đăng xuất...');

          google.script.run
            .withSuccessHandler(function(response) {
              hideLoading();
              if (response.success) {
                showModal('Thành công', 'Đăng xuất thành công!', 'success');
                setTimeout(function() {
                  window.location.href = '<?= ScriptApp.getService().getUrl() ?>?page=login';
                }, 1000);
              }
            })
            .withFailureHandler(function(error) {
              hideLoading();
              showModal('Lỗi', 'Không thể đăng xuất: ' + error.message, 'danger');
            })
            .handleLogout();
        },
        function() {
          // User cancelled - do nothing
          console.log('Logout cancelled');
        }
      );
    }
  </script>
</body>
</html>
