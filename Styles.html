<style>
/* =====================================================
   FILE: Styles.html
   MÔ TẢ: CSS toàn cục - Responsive, hiện đại
   ===================================================== */

/* ==================== RESET & GLOBAL ==================== */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --primary-color: #f99d07;
  --danger-color: #e94849;
  --info-color: #3782f4;
  --success-color: #24c560;
  --warning-color: #ffc107;
  --dark-color: #2c3e50;
  --light-color: #ecf0f1;
  --white-color: #ffffff;
  --gray-color: #95a5a6;
  --border-radius: 8px;
  --box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  --transition: all 0.3s ease;
  --sidebar-width: 260px;
  --header-height: 60px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  font-size: 14px;
  line-height: 1.6;
  color: var(--dark-color);
  background-color: #f5f6fa;
  /* overflow-x: hidden; REMOVED - This was blocking horizontal scroll in tables */
}

/* ==================== LAYOUT ==================== */

.app-container {
  display: flex;
  min-height: 100vh;
  width: 100%;
}

/* Sidebar */
.sidebar {
  width: var(--sidebar-width);
  background-color: var(--dark-color);
  color: var(--white-color);
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
  overflow-y: auto;
  z-index: 1000;
  transition: var(--transition);
}

.sidebar-header {
  padding: 20px;
  text-align: center;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  background: linear-gradient(135deg, var(--primary-color), var(--info-color));
}

.sidebar-header h1 {
  font-size: 20px;
  font-weight: 700;
  margin: 0;
  color: var(--white-color);
}

.sidebar-header p {
  font-size: 12px;
  margin-top: 5px;
  opacity: 0.9;
}

.sidebar-menu {
  padding: 20px 0;
  list-style: none;
}

.sidebar-menu li {
  margin-bottom: 5px;
}

.sidebar-menu a {
  display: flex;
  align-items: center;
  padding: 12px 20px;
  color: var(--white-color);
  text-decoration: none;
  transition: var(--transition);
  position: relative;
}

.sidebar-menu a:hover {
  background-color: rgba(255,255,255,0.1);
  padding-left: 25px;
}

.sidebar-menu a.active {
  background-color: var(--primary-color);
  border-left: 4px solid var(--white-color);
}

.sidebar-menu a i {
  margin-right: 12px;
  font-size: 18px;
  width: 20px;
  text-align: center;
}

/* Main Content */
.main-content {
  flex: 1;
  margin-left: var(--sidebar-width);
  transition: var(--transition);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Header */
.app-header {
  height: var(--header-height);
  background-color: var(--white-color);
  box-shadow: var(--box-shadow);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 30px;
  position: sticky;
  top: 0;
  z-index: 999;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 15px;
}

.menu-toggle {
  display: none;
  background: none;
  border: none;
  font-size: 24px;
  cursor: pointer;
  color: var(--dark-color);
}

.header-title h2 {
  font-size: 22px;
  font-weight: 600;
  color: var(--dark-color);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 20px;
}

.user-info {
  display: flex;
  align-items: center;
  gap: 10px;
}

.user-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary-color), var(--info-color));
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--white-color);
  font-weight: 600;
  font-size: 14px;
}

.user-details {
  display: flex;
  flex-direction: column;
}

.user-name {
  font-weight: 600;
  color: var(--dark-color);
  font-size: 14px;
}

.user-role {
  font-size: 12px;
  color: var(--gray-color);
}

/* User Dropdown */
.user-dropdown {
  position: relative;
}

.user-dropdown-toggle {
  background: none;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: var(--border-radius);
  transition: var(--transition);
}

.user-dropdown-toggle:hover {
  background-color: var(--light-color);
}

.user-dropdown-menu {
  position: absolute;
  top: 100%;
  right: 0;
  margin-top: 8px;
  background-color: var(--white-color);
  border-radius: var(--border-radius);
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  min-width: 220px;
  opacity: 0;
  visibility: hidden;
  transform: translateY(-10px);
  transition: var(--transition);
  z-index: 1000;
}

.user-dropdown.active .user-dropdown-menu {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.user-dropdown-menu a,
.user-dropdown-menu button {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  color: var(--dark-color);
  text-decoration: none;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  cursor: pointer;
  transition: var(--transition);
  font-size: 14px;
}

.user-dropdown-menu a:hover,
.user-dropdown-menu button:hover {
  background-color: var(--light-color);
}

.user-dropdown-menu a i,
.user-dropdown-menu button i {
  width: 18px;
  text-align: center;
}

.user-dropdown-divider {
  height: 1px;
  background-color: var(--light-color);
  margin: 8px 0;
}

/* Content Area */
.content-area {
  flex: 1;
  padding: 30px;
  overflow-y: auto;
}

/* ==================== BUTTONS ==================== */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 10px 20px;
  border: none;
  border-radius: var(--border-radius);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition);
  text-decoration: none;
  gap: 8px;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: var(--box-shadow);
}

.btn:active {
  transform: translateY(0);
}

.btn-primary {
  background-color: var(--primary-color);
  color: var(--white-color);
}

.btn-primary:hover {
  background-color: #e08c06;
}

.btn-success {
  background-color: var(--success-color);
  color: var(--white-color);
}

.btn-danger {
  background-color: var(--danger-color);
  color: var(--white-color);
}

.btn-info {
  background-color: var(--info-color);
  color: var(--white-color);
}

.btn-secondary {
  background-color: var(--gray-color);
  color: var(--white-color);
}

.btn-sm {
  padding: 6px 12px;
  font-size: 12px;
}

.btn-lg {
  padding: 14px 28px;
  font-size: 16px;
}

.btn-block {
  width: 100%;
}

/* ==================== CARDS ==================== */

.card {
  background-color: var(--white-color);
  border-radius: var(--border-radius);
  box-shadow: var(--box-shadow);
  padding: 20px;
  margin-bottom: 20px;
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  padding-bottom: 15px;
  border-bottom: 2px solid var(--light-color);
}

.card-title {
  font-size: 18px;
  font-weight: 600;
  color: var(--dark-color);
  display: flex;
  align-items: center;
  gap: 10px;
}

.card-actions {
  display: flex;
  gap: 10px;
}

.card-body {
  padding: 10px 0;
}

/* ==================== TABLE ==================== */

.table-container {
  width: 100%;
  overflow-x: auto;
  overflow-y: auto;
  border-radius: var(--border-radius);
  background-color: var(--white-color);
  max-height: 500px;
  -webkit-overflow-scrolling: touch;
}

table {
  width: 100%;
  min-width: 800px;
  table-layout: auto;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 14px;
}

thead {
  /* position: sticky; TEMPORARILY DISABLED - Causes header/data misalignment on horizontal scroll */
  /* top: 0; */
  z-index: 10;
  background-color: var(--dark-color);
}

thead th {
  padding: 12px 15px;
  text-align: left;
  font-weight: 600;
  color: var(--white-color);
  background-color: var(--dark-color);
  white-space: nowrap;
  border-right: 1px solid rgba(255, 255, 255, 0.1);
}

thead th:last-child {
  border-right: none;
}

tbody tr {
  border-bottom: 1px solid var(--light-color);
  transition: var(--transition);
}

tbody tr:hover {
  background-color: #f8f9fa;
}

tbody td {
  padding: 12px 15px;
  white-space: nowrap;
  border-right: 1px solid var(--light-color);
}

tbody td:last-child {
  border-right: none;
}

.table-actions {
  display: flex;
  gap: 8px;
}

.table-actions .btn {
  padding: 6px 10px;
  font-size: 12px;
}

/* ==================== STICKY COLUMNS (MOBILE) ==================== */

/* Responsive adjustments for mobile */
@media (max-width: 768px) {
  /* Reduce table min-width on mobile */
  table {
    min-width: 600px;
  }
}

/* ==================== FORMS ==================== */

.form-group {
  margin-bottom: 20px;
}

.form-label {
  display: block;
  margin-bottom: 8px;
  font-weight: 500;
  color: var(--dark-color);
  font-size: 14px;
}

.form-label.required::after {
  content: ' *';
  color: var(--danger-color);
}

.form-control {
  width: 100%;
  padding: 10px 15px;
  border: 1px solid #ddd;
  border-radius: var(--border-radius);
  font-size: 14px;
  transition: var(--transition);
}

.form-control:focus {
  outline: none;
  border-color: var(--primary-color);
  box-shadow: 0 0 0 3px rgba(249, 157, 7, 0.1);
}

textarea.form-control {
  resize: vertical;
  min-height: 100px;
}

select.form-control {
  cursor: pointer;
}

.input-group {
  position: relative;
  display: flex;
  align-items: center;
}

.input-group-icon {
  position: absolute;
  left: 15px;
  color: var(--gray-color);
  pointer-events: none;
}

.input-group .form-control {
  padding-left: 45px;
}

.form-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
}

/* ==================== MODAL ==================== */

.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(0,0,0,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10000;
  opacity: 0;
  visibility: hidden;
  transition: var(--transition);
}

.modal-overlay.show {
  opacity: 1;
  visibility: visible;
}

.modal {
  background-color: var(--white-color);
  border-radius: var(--border-radius);
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  max-width: 600px;
  width: 90%;
  max-height: 90vh;
  overflow-y: auto;
  transform: scale(0.7);
  transition: var(--transition);
}

.modal-overlay.show .modal {
  transform: scale(1);
}

.modal-header {
  padding: 20px;
  border-bottom: 1px solid var(--light-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-title {
  font-size: 18px;
  font-weight: 600;
  color: var(--dark-color);
}

.modal-close {
  background: none;
  border: none;
  font-size: 24px;
  cursor: pointer;
  color: var(--gray-color);
  transition: var(--transition);
}

.modal-close:hover {
  color: var(--danger-color);
}

.modal-body {
  padding: 20px;
}

.modal-footer {
  padding: 20px;
  border-top: 1px solid var(--light-color);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

/* ==================== ALERTS & TOASTS ==================== */

.alert {
  padding: 15px 20px;
  border-radius: var(--border-radius);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14px;
}

.alert-success {
  background-color: #d4edda;
  color: #155724;
  border-left: 4px solid var(--success-color);
}

.alert-danger {
  background-color: #f8d7da;
  color: #721c24;
  border-left: 4px solid var(--danger-color);
}

.alert-warning {
  background-color: #fff3cd;
  color: #856404;
  border-left: 4px solid var(--warning-color);
}

.alert-info {
  background-color: #d1ecf1;
  color: #0c5460;
  border-left: 4px solid var(--info-color);
}

/* ==================== UTILITIES ==================== */

.text-center { text-align: center; }
.text-right { text-align: right; }
.text-left { text-align: left; }

.text-primary { color: var(--primary-color); }
.text-danger { color: var(--danger-color); }
.text-success { color: var(--success-color); }
.text-info { color: var(--info-color); }
.text-muted { color: var(--gray-color); }

.mt-10 { margin-top: 10px; }
.mt-20 { margin-top: 20px; }
.mb-10 { margin-bottom: 10px; }
.mb-20 { margin-bottom: 20px; }

.d-flex { display: flex; }
.align-items-center { align-items: center; }
.justify-content-between { justify-content: space-between; }
.gap-10 { gap: 10px; }
.gap-20 { gap: 20px; }

.hidden { display: none !important; }

/* Loading Spinner */
.loading {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  border-top-color: var(--white-color);
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ==================== RESPONSIVE ==================== */

@media (max-width: 768px) {
  :root {
    --sidebar-width: 70px;
  }

  .sidebar {
    width: var(--sidebar-width);
  }

  .sidebar-header h1,
  .sidebar-header p,
  .sidebar-menu a span {
    display: none;
  }

  .sidebar-menu a {
    justify-content: center;
  }

  .sidebar-menu a i {
    margin: 0;
  }

  .main-content {
    margin-left: var(--sidebar-width);
  }

  .menu-toggle {
    display: block;
  }

  .app-header {
    padding: 0 15px;
  }

  .user-details {
    display: none;
  }

  .content-area {
    padding: 15px;
  }

  .form-row {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 480px) {
  .sidebar {
    width: 0;
    opacity: 0;
  }

  .sidebar.show {
    width: 260px;
    opacity: 1;
  }

  .main-content {
    margin-left: 0;
  }
}
</style>
