<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Quản Lý Chi Tiêu</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Include Styles -->
  <?!= include('Styles'); ?>

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background: var(--white-color);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
      animation: slideUp 0.5s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, var(--primary-color), var(--info-color));
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: var(--white-color);
      box-shadow: 0 10px 30px rgba(249, 157, 7, 0.3);
    }

    .login-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--dark-color);
      margin-bottom: 10px;
    }

    .login-subtitle {
      font-size: 14px;
      color: var(--gray-color);
    }

    .password-toggle {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--gray-color);
      font-size: 16px;
      transition: var(--transition);
      z-index: 10;
    }

    .password-toggle:hover {
      color: var(--primary-color);
    }

    .login-footer {
      text-align: center;
      margin-top: 30px;
      font-size: 12px;
      color: var(--gray-color);
    }

    #loginBtn .loading {
      border-top-color: var(--white-color);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <!-- Header -->
      <div class="login-header">
        <div class="login-logo">
          <i class="fas fa-wallet"></i>
        </div>
        <h1 class="login-title">Đăng Nhập</h1>
        <p class="login-subtitle">Quản Lý Chi Tiêu Cá Nhân</p>
      </div>

      <!-- Alert -->
      <div id="alertContainer"></div>

      <!-- Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <!-- Username -->
        <div class="form-group">
          <label class="form-label required">Tên đăng nhập</label>
          <div class="input-group">
            <i class="fas fa-user input-group-icon"></i>
            <input
              type="text"
              id="username"
              class="form-control"
              placeholder="Nhập tên đăng nhập"
              required
              autocomplete="username"
            >
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label required">Mật khẩu</label>
          <div class="input-group" style="position: relative;">
            <i class="fas fa-lock input-group-icon"></i>
            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="Nhập mật khẩu"
              required
              autocomplete="current-password"
            >
            <button
              type="button"
              class="password-toggle"
              onclick="togglePassword()"
              aria-label="Hiện/Ẩn mật khẩu"
            >
              <i class="fas fa-eye" id="toggleIcon"></i>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="loginBtn" class="btn btn-primary btn-block btn-lg">
          <span id="loginBtnText">Đăng Nhập</span>
          <span id="loginBtnLoading" class="loading hidden"></span>
        </button>
      </form>

      <!-- Footer -->
      <div class="login-footer">
        <p>© 2025 Quản Lý Chi Tiêu. All rights reserved.</p>
      </div>
    </div>
  </div>

  <script>
    // Toggle Password Visibility
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.getElementById('toggleIcon');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.classList.remove('fa-eye');
        toggleIcon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        toggleIcon.classList.remove('fa-eye-slash');
        toggleIcon.classList.add('fa-eye');
      }
    }

    // Show Alert
    function showAlert(message, type = 'danger') {
      const alertContainer = document.getElementById('alertContainer');
      const alertClass = `alert-${type}`;
      const iconClass = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';

      alertContainer.innerHTML = `
        <div class="alert ${alertClass}">
          <i class="fas ${iconClass}"></i>
          <span>${message}</span>
        </div>
      `;

      // Auto hide after 5 seconds
      setTimeout(() => {
        alertContainer.innerHTML = '';
      }, 5000);
    }

    // Handle Login
    function handleLogin(event) {
      event.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showAlert('Vui lòng nhập đầy đủ thông tin', 'warning');
        return;
      }

      // Show loading
      const loginBtn = document.getElementById('loginBtn');
      const loginBtnText = document.getElementById('loginBtnText');
      const loginBtnLoading = document.getElementById('loginBtnLoading');

      loginBtn.disabled = true;
      loginBtnText.classList.add('hidden');
      loginBtnLoading.classList.remove('hidden');

      // Call server
      google.script.run
        .withSuccessHandler(function(response) {
          if (response.success) {
            showAlert(response.message, 'success');

            // Redirect to home after 1 second
            setTimeout(() => {
              window.location.href = '<?= ScriptApp.getService().getUrl() ?>?page=home';
            }, 1000);
          } else {
            showAlert(response.message, 'danger');

            // Reset button
            loginBtn.disabled = false;
            loginBtnText.classList.remove('hidden');
            loginBtnLoading.classList.add('hidden');
          }
        })
        .withFailureHandler(function(error) {
          showAlert('Lỗi kết nối: ' + error.message, 'danger');

          // Reset button
          loginBtn.disabled = false;
          loginBtnText.classList.remove('hidden');
          loginBtnLoading.classList.add('hidden');
        })
        .handleLogin(username, password);
    }

    // Auto focus username
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('username').focus();
    });
  </script>
</body>
</html>
